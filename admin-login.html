<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="styles.css?v=3.0.0"></head><body><main class="auth-wrap"><div class="card auth-card"><div class="brand"><img src="assets/logo.png"><span>Lao Web Studio V3.0</span></div><h1 data-i18n="login">Login</h1><form id="login-form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn btn-primary" data-i18n="login">Login</button><p id="msg"></p></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=3.0.0"></script><script src="supabase-client.js?v=3.0.0"></script><script src="i18n.js?v=3.0.0"></script><script src="auth.js?v=3.0.0"></script><script>
document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const r=await LWS_AUTH.login(email.value,password.value);if(r.error)msg.textContent=r.error.message;else location.href='admin.html'};
</script></body></html>

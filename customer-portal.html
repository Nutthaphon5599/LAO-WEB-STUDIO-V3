<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Portal</title><link rel="stylesheet" href="styles.css?v=3.0.0"></head><body><main class="container section"><div class="toolbar"><div class="brand"><img src="assets/logo.png"><span>Customer Portal</span></div><button class="btn btn-primary" onclick="LWS_AUTH.logout()">Logout</button></div><div id="portal" class="grid2"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=3.0.0"></script><script src="supabase-client.js?v=3.0.0"></script><script src="auth.js?v=3.0.0"></script><script>
(async()=>{const sb=LWS.supabase;const {data:{user}}=await sb.auth.getUser();if(!user){location.href='customer-login.html';return}const [u,t,i]=await Promise.all([sb.from('project_updates').select('*').eq('customer_user_id',user.id),sb.from('tasks').select('*').eq('customer_user_id',user.id),sb.from('invoices').select('*').eq('customer_user_id',user.id)]);portal.innerHTML=`<div class="card"><h2>Updates</h2><pre>${JSON.stringify(u.data||[],null,2)}</pre></div><div class="card"><h2>Tasks</h2><pre>${JSON.stringify(t.data||[],null,2)}</pre></div><div class="card"><h2>Invoices</h2><pre>${JSON.stringify(i.data||[],null,2)}</pre></div>`})();
</script></body></html>
